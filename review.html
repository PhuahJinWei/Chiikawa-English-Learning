<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Listen and check</title>
    <style>
      :root { --ink: #66432f; --ink-2: #8a6a55; --paper: #fff9ef; --card: #fff; --hi: #cfe8fa; --sun: #ffe6a0; --line: #f4e1c1; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 16px 16px 60px; }
      h1 { font-size: 22px; margin: 4px 0 6px; }
      h2 { font-size: 17px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
      p.lead { margin: 0 0 6px; font-size: 14px; line-height: 1.6; }
      .ex { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; margin: 10px 0; }
      .ex-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
      .ex-title { font-weight: 900; font-size: 16px; }
      .meta { font-size: 12px; color: var(--ink-2); }
      .when { font-size: 13px; margin: 4px 0 6px; line-height: 1.5; }
      .line { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
      .role { font-size: 11px; font-weight: 800; color: var(--ink-2); }
      .blocks { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 5px; }
      .block { display: flex; flex-direction: column; align-items: center; border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
      .kana { font-size: 15px; font-weight: 700; color: var(--ink-2); padding-top: 6px; white-space: nowrap; }
      .stress { font-weight: 900; color: var(--ink); -webkit-text-emphasis: filled circle; text-emphasis: filled circle; -webkit-text-emphasis-position: over right; text-emphasis-position: over right; }
      .word { font-family: ui-rounded, "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif; font-weight: 800; font-size: 19px; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; white-space: nowrap; }
      .hi .word { background: var(--hi); border-width: 3px; }
      .block.playing .word { background: var(--sun); }
      .ja { font-size: 14px; margin-top: 3px; }
      .tech { font-size: 11px; color: var(--ink-2); font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
      button.play { font: inherit; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
      .ear { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
      .ear .q { font-size: 13px; line-height: 1.5; }
      .ear .buttons { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
      .missing { color: #b03a48; font-size: 12px; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./src/dev/review.ts"></script>
  </body>
</html>
