<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A private app for one learner: keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>えいごフレンズ</title>
    <meta name="description" content="ちいかわたちと一緒に、話す英語を練習" />

    <!-- Icons: the star from art/portrait_hoshi.png (made by icon-maker.html). -->
    <link rel="icon" type="image/png" href="./icons/favicon.png" />

    <!-- Home-screen app on iPhone. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="えいごフレンズ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fff9ef" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* The start-up panel (REVIEW 4.9): plain CSS, independent of the app's own styles. */
      /* Top, left, width and height rather than four offsets: the build would turn those into 'inset', which iOS
         before 14.5 (the phones this panel is for) does not know. */
      #boot {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        z-index: 99;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff9ef;
        color: #66432f;
        font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', system-ui, sans-serif;
        font-weight: bold;
        line-height: 1.6;
      }
      #boot[hidden] {
        display: none;
      }
      #boot .boot-card {
        max-width: 420px;
      }
      #boot .boot-title {
        font-size: 20px;
        margin: 0 0 10px;
      }
      #boot p {
        margin: 0 0 16px;
      }
      #boot button {
        display: block;
        width: 100%;
        min-height: 56px;
        border: 3px solid #66432f;
        border-radius: 18px;
        background: #ffe6a0;
        color: #66432f;
        font: inherit;
        font-size: 18px;
      }
      #boot button[disabled] {
        opacity: 0.6;
      }
      #boot pre {
        margin: 16px 0 0;
        font-size: 11px;
        font-weight: normal;
        color: #8a6a55;
        white-space: pre-wrap;
        word-break: break-all;
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" hidden>
      <div class="boot-card">
        <p class="boot-title" id="boot-title">読み込みに時間がかかっています</p>
        <p>電波のよいところで「もう一度読み込む」を押してください。何度やっても開かないときは、この画面のスクリーンショットを送ってください。</p>
        <button type="button" onclick="window.__bootReload(this)">もう一度読み込む</button>
        <pre id="boot-detail"></pre>
      </div>
    </div>
    <noscript>このアプリには JavaScript が必要です。</noscript>
    <script>
      // Old-style JavaScript on purpose: this must run on any iPhone, even one too old for the app itself. If the
      // app has not started after 8 seconds, or an error stops it starting, a message, a reload button and the
      // phone's details appear (REVIEW 4.9). main.ts removes the panel once the app has started.
      (function () {
        var lastError = '';
        function show(detail, failed) {
          if (window.__booted) return;
          var panel = document.getElementById('boot');
          if (!panel) return;
          panel.hidden = false;
          if (failed) document.getElementById('boot-title').textContent = 'えいごフレンズを開けませんでした';
          document.getElementById('boot-detail').textContent = (detail ? detail + '\n\n' : '') + navigator.userAgent;
        }
        window.__bootFailed = function (detail) {
          show(detail, true);
        };
        // もう一度読み込む (2026-11-17, reworked 2026-11-18): a plain reload would open the same broken version again,
        // because a newer one waits until the app (which did not start) tells it to take over. So the button asks for
        // a newer version and tells it to take over as soon as it is downloaded, including one the phone was already
        // downloading, and the page reloads once it has. With nothing newer, or no connection, it reloads at once. It
        // says it is working, never takes longer than 20 seconds, and leaves the app alone if it has started meanwhile.
        // The message must be the one the service worker listens for (src/worker-message.ts; tests/boot.test.ts).
        window.__bootReload = function (button) {
          var done = false;
          function go() {
            if (done) return;
            done = true;
            if (!window.__booted) location.reload();
          }
          if (button) {
            button.disabled = true;
            button.textContent = '読み込み中…';
          }
          setTimeout(go, 20000);
          try {
            var sw = navigator.serviceWorker;
            if (!sw || !sw.controller) return go();
            sw.addEventListener('controllerchange', go);
            sw.getRegistration().then(function (reg) {
              if (!reg) return go();
              // Nothing newer on its way (the check found none, or a download failed): reload now. A moment's wait
              // first, so a download the check has just started is seen.
              function settle() {
                setTimeout(function () {
                  if (!reg.installing && !reg.waiting) go();
                }, 300);
              }
              function watch(worker) {
                if (!worker) return;
                if (worker.state === 'installed') return worker.postMessage({ type: 'activate' });
                worker.addEventListener('statechange', function () {
                  if (worker.state === 'installed') worker.postMessage({ type: 'activate' });
                  if (worker.state === 'redundant') settle();
                });
              }
              watch(reg.waiting);
              watch(reg.installing);
              reg.addEventListener('updatefound', function () {
                watch(reg.installing);
              });
              reg.update().then(settle, settle);
            }, go);
          } catch (e) {
            go();
          }
        };
        window.addEventListener('error', function (e) {
          lastError = (e && e.message) || 'error';
          setTimeout(function () {
            show(lastError, true);
          }, 1500);
        });
        setTimeout(function () {
          show(lastError, !!lastError);
        }, 8000);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
