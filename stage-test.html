<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Stage test</title>
    <style>
      :root { --ink: #66432f; --paper: #fff9ef; --sky: #bfe6f5; --blush: #f6bfcb; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
      #stage { position: relative; height: 46vh; min-height: 300px; max-height: 440px; overflow: hidden; border-bottom: 3px solid var(--ink); }
      .dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #ff4f7b; border: 2px solid #fff; pointer-events: none; z-index: 2; }
      #fps { position: absolute; right: 6px; top: 6px; font-size: 11px; background: #fff9; padding: 2px 6px; border-radius: 8px; z-index: 2; }
      #panel { padding: 8px 12px 40px; font-size: 13px; }
      h3 { margin: 10px 0 4px; font-size: 12px; letter-spacing: .04em; }
      .row { display: flex; flex-wrap: wrap; gap: 5px; }
      button { font: inherit; font-size: 12px; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 9px; }
      button.on { background: var(--sky); }
      select { font: inherit; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="stage"><span id="fps">…</span></div>
    <div id="panel">
      <h3>Cast</h3>
      <div class="row" id="casts"></div>
      <h3>Who</h3>
      <div class="row" id="who"></div>
      <h3>Gesture</h3>
      <div class="row" id="gestures"></div>
      <h3>Face</h3>
      <div class="row" id="faces"></div>
      <h3>Mark</h3>
      <div class="row" id="marks"></div>
      <h3>Talking / looking</h3>
      <div class="row" id="misc"></div>
    </div>
    <script type="module" src="./src/stage/test-page.ts"></script>
  </body>
</html>
