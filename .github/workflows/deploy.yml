# Publishes the app to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The build runs the type check and all tests first, so a broken pack or missing audio never goes live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Every job can only read the code, unless it has its own permissions (which then replace these): the build job,
# which installs and runs dependencies, cannot publish; only the deploy job can. This limits what a bad dependency
# could do with the build job's token. What the build job uploads is still what gets published.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # No configure-pages step: it only reads the Pages settings, and nothing used what it found (the app's paths are
  # relative: vite.config.ts, base './'). Without it, this job needs nothing but the code.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the app's 最終更新 is the newest commit that changed it (vite.config.ts).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
