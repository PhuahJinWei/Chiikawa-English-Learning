# Publishes the app to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The build runs the type check and all tests first, so a broken pack or missing audio never goes live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job (which installs and runs dependencies) can only read the code; only the deploy job may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Reading the Pages settings (configure-pages) is all this job needs beyond the code.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
